name: Validate calculator

on:
  push:
    branches: [main, refactor/portfolio-ready]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -s index.html
          test -s style.css
          test -s script.js
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Check local asset references
        run: |
          grep -q 'href="style.css"' index.html
          grep -q 'src="script.js"' index.html
