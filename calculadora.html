<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Calculadora simples feita com HTML, CSS e JavaScript por Diógenes Moreira." />
  <title>Calculadora | Diógenes Moreira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Manrope:wght@500;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span>+</span>
    <span>÷</span>
    <span>×</span>
    <span>=</span>
    <span>−</span>
    <span>%</span>
  </div>

  <main class="calculator">
    <p class="eyebrow">Diógenes Moreira</p>
    <h1>Calculadora</h1>

    <output id="resultado" aria-live="polite">0</output>

    <div class="keys">
      <button class="botao chave" type="button" data-action="clear">C</button>
      <button class="botao chave" type="button" data-action="backspace" aria-label="Apagar último caractere">⌫</button>
      <button class="botao operador" type="button" data-value="/">÷</button>
      <button class="botao operador" type="button" data-value="*">×</button>

      <button class="botao" type="button" data-value="7">7</button>
      <button class="botao" type="button" data-value="8">8</button>
      <button class="botao" type="button" data-value="9">9</button>
      <button class="botao operador" type="button" data-value="-">−</button>

      <button class="botao" type="button" data-value="4">4</button>
      <button class="botao" type="button" data-value="5">5</button>
      <button class="botao" type="button" data-value="6">6</button>
      <button class="botao operador" type="button" data-value="+">+</button>

      <button class="botao" type="button" data-value="1">1</button>
      <button class="botao" type="button" data-value="2">2</button>
      <button class="botao" type="button" data-value="3">3</button>
      <button class="botao igual" type="button" data-action="calculate" aria-label="Calcular resultado">=</button>

      <button class="botao zero" type="button" data-value="0">0</button>
      <button class="botao" type="button" data-value=".">.</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
